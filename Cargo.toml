[workspace]
resolver = "2"
members = [
    "crates/trames-memory", "crates/trames-elf", "crates/trames-cpu",
    "crates/trames-linux", "crates/trames-core", "crates/trames-cli", "crates/trames-vfs", "crates/trames-net", "crates/trames-distro", "crates/trames-ffi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/kb5000/trames"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
lto = "thin"
