[workspace]
resolver = "2"
members = [
    "crates/trames-execution",
    "crates/trames-kernel",
    "crates/trames-hvf",
    "crates/trames-mac",
    "crates/trames-shared", "crates/trames-wayland", "crates/trames-memory", "crates/trames-elf", "crates/trames-cpu", "crates/trames-vulkan",
    "crates/trames-linux", "crates/trames-core", "crates/trames-cli", "crates/trames-vfs", "crates/trames-net", "crates/trames-distro", "crates/trames-ffi", "crates/trames-bridge", "crates/trames-accel", "crates/trames-compute", "crates/trames-native",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.101"
license = "GPL-3.0-or-later"
repository = "https://github.com/kb5000/trames"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Preserve established iterator/branch forms during the pinned nightly migration.
# These advisory source-style lints do not diagnose correctness problems.
[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
needless_late_init = "allow"
manual_checked_ops = "allow"

[profile.release]
overflow-checks = true
lto = "thin"

[patch.crates-io]
wayland-backend = { path = "vendor/wayland-backend" }
