[package]
name = "trames-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["poll"] }
socket2 = { version = "=0.6.1", features = ["all"] }

smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "iface-max-addr-count-4", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp", "proto-ipv4-fragmentation", "proto-ipv6-fragmentation", "fragmentation-buffer-size-65536", "reassembly-buffer-size-65536", "reassembly-buffer-count-2"] }
getrandom = "=0.3.4"

[lints]
workspace = true
