[package]
name = "trames-distro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
trames-vfs = { path = "../trames-vfs" }
trames-elf = { path = "../trames-elf" }
trames-memory = { path = "../trames-memory" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.2.1"
ext4-view = { path = "../../vendor/ext4-view", features = ["std"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
