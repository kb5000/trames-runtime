[package]
name = "trames-wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
trames-shared = { path = "../trames-shared" }
wayland-server = "=0.31.14"
wayland-scanner = "=0.31.11"
wayland-backend = "=0.3.17"
wayland-protocols = { version = "=0.32.13", features = ["server", "unstable", "staging"] }
libc = "0.2"
x11rb = { version = "=0.13.2", default-features = false, features = ["composite", "xfixes", "xtest"] }
xim = { version = "=0.5.0", default-features = false, features = ["x11rb-server"] }

[lints]
workspace = true
