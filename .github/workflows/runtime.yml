name: Runtime
on:
  push:
    paths-ignore: ['third-party/inputs.json', 'tests/acceptance/**', 'docs/architecture/acceptance.md', 'docs/validation/acceptance/**', '.github/workflows/acceptance.yml']
  pull_request:
    paths-ignore: ['third-party/inputs.json', 'tests/acceptance/**', 'docs/architecture/acceptance.md', 'docs/validation/acceptance/**', '.github/workflows/acceptance.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native PCM test headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev
      - name: Compile ALSA ABI oracle
        if: runner.os == 'Linux'
        run: python3 scripts/check-alsa-abi.py
      - run: rustup show
      - run: python3 scripts/check-execution-boundaries.py
      - run: python3 scripts/build-guest-cli.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Verify musl DNS ABI with a GNU C frontend
        if: matrix.os == 'ubuntu-24.04'
        env:
          CC_x86_64_unknown_linux_musl: cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: cc
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo test -p trames-net --target x86_64-unknown-linux-musl --lib --locked
      - run: cargo build --workspace --all-features --release --locked
      - run: cargo run --release -p trames-memory --example reclaim-footprint --locked
